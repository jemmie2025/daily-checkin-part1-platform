table_name: checkin_event_health_reporting
schema: checkin_analytics
database_uuid: 9bb1d984-e169-4454-9842-81d876cc1943
main_dttm_col: event_date
description: Privacy-minimized event volume, latency, and ingestion-lag health.
cache_timeout: 300
columns:
  - column_name: event_date
    is_dttm: true
    type: DATE
  - column_name: event_name
    type: STRING
  - column_name: event_count
    type: BIGINT
  - column_name: p50_latency_ms
    type: FLOAT
  - column_name: p95_latency_ms
    type: FLOAT
  - column_name: max_ingestion_lag_seconds
    type: BIGINT
metrics:
  - metric_name: event_total
    expression: SUM(event_count)
    metric_type: sum
  - metric_name: p95_latency_ms
    expression: MAX(p95_latency_ms)
    metric_type: max
  - metric_name: max_ingestion_lag_seconds
    expression: MAX(max_ingestion_lag_seconds)
    metric_type: max
uuid: fc854340-f5e1-4ae0-9bf0-563ce85cad83
version: 1.0.0
